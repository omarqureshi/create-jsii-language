name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bootstrap toolchain
        uses: ./.github/actions/bootstrap-toolchain

      - name: Unit tests (naming, version mapping, overlay, rosetta corpus)
        run: npm test

      # Once your guest runtime exists, wire the conformance suite here — the
      # Ruby reference runs it as `npm run test:compliance`: regenerate the
      # jsii-calc fixture bindings through --plugin (bootstrap with
      # build-jsii-calc: 'true'), install the published @jsii/runtime for the
      # kernel, and drive the full suite against the generated bindings.
